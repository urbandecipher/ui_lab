name: Build check
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build from src
        run: node build.mjs
      - name: dist/ must match src/ (run `node build.mjs` before committing)
        run: git diff --exit-code -- dist/
