<div class="mask-form">
  <div class="field-wrap mask-field" data-mask="phone">
    <label>手機號碼</label>
    <input type="text" inputmode="tel" autocomplete="tel-national" placeholder="0912-345-678">
    <div class="field-msg"></div>
  </div>
  <div class="field-wrap mask-field" data-mask="tw-id">
    <label>身分證字號</label>
    <input type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="A123456789">
    <div class="field-msg"></div>
  </div>
</div>
