<div class="field-wrap time-wrap">
  <span class="time-label">預約時間</span>
  <div class="time-row">
    <div class="time-field">
      <span class="time-seg" data-part="h"></span><span class="time-sep" aria-hidden="true">:</span><span class="time-seg" data-part="m"></span>
    </div>
    <button type="button" class="catalog-button time-now">最近時段</button>
  </div>
  <input type="hidden" name="time" class="time-value">
  <div class="field-msg time-msg"></div>
</div>
