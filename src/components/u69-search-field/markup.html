<form class="sf" role="search">
  <label class="sf-label">搜尋文章</label>
  <div class="sf-box">
    <span class="sf-icon" aria-hidden="true">⌕</span>
    <input class="sf-input" type="search" placeholder="輸入關鍵字後按 Enter" autocomplete="off" enterkeyhint="search">
    <button type="button" class="sf-clear" hidden>×</button>
  </div>
  <p class="sf-result"></p>
  <div class="sf-recent">
    <div class="sf-recent-head"><span>最近搜尋</span><button type="button" class="sf-clear-all">清除紀錄</button></div>
    <ul class="sf-recent-list"></ul>
  </div>
</form>
