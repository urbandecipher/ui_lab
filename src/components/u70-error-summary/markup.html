<form class="es-form" novalidate>
  <div class="es-summary" hidden>
    <h4 class="es-title"></h4>
    <ul class="es-list"></ul>
  </div>
  <div class="field-wrap es-field" data-field="name">
    <label>姓名</label>
    <input type="text" autocomplete="name">
    <div class="field-msg"></div>
  </div>
  <div class="field-wrap es-field" data-field="email">
    <label>電子郵件</label>
    <input type="email" autocomplete="email" inputmode="email">
    <div class="field-msg"></div>
  </div>
  <div class="es-field es-check" data-field="terms">
    <label class="check-row"><input type="checkbox"> 我已閱讀並同意服務條款</label>
    <div class="field-msg"></div>
  </div>
  <button type="submit" class="btn btn-primary es-submit">送出</button>
  <p class="es-done" hidden>已送出，謝謝！</p>
</form>
