  <div class="ss-body">
    <section id="ss-intro"><h4>簡介</h4><p>UI LAB 是與框架無關的互動元件規範集，每個元件都能操作、切換狀態並匯出。</p></section>
    <section id="ss-install"><h4>安裝</h4><p>不需要安裝。下載單一 HTML 檔，用瀏覽器開啟即可；修改原始碼後執行 node build.mjs 重新建置。</p></section>
    <section id="ss-usage"><h4>使用方式</h4><p>在檢視器選擇狀態、複製程式碼，或下載完整 HTML。同一頁可放多個相同元件。</p></section>
    <section id="ss-faq"><h4>常見問題</h4><p>匯出的檔案可以離線使用嗎？可以，所有樣式與程式都在檔案內，不需要網路。</p></section>
